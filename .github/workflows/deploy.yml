name: Deploy Static Website to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required to check out code

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync ./dist s3://${{ vars.hsu-website-assets }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.E1E33RXITQ98I2 }} --paths "/*"